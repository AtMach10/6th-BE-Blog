name: CI/CD Pipeline

on:
  push:
    branches:
      - "장유정/main"
      - "장유정/8주차"
  pull_request:
    branches:
      - "장유정/main"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
     # 1. 레포 클론
      - name: Checkout repository
        uses: actions/checkout@v3

    # 2. JDK 설치
      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '23'

    # 3. Gradle 캐시 최적화
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

    # 4. Gradle 빌드
      - name: Build with Gradle
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew build -x test #테스트 제외
 
    # 5. application.yml secret 적용  
      - name: Write application.yml
        run: |
          echo "${{ secrets.APPLICATION_YML }}" > backend/src/main/resources/application.yml

    # 6. Docker Hub 로그인 
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

    # 7. Docker 컨테이너
      - name: Build and Push Docker Image
        run: |
          cd backend
          docker build -t docyoojung/my-app:latest .
          docker push docyoojung/my-app:latest

    # 8. EC2 접속해서 Docker pull 및 up
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port : 22
          script: |
            cd /myproject                 # docker-compose.yml 있는 디렉토리
            docker-compose pull            # 최신 이미지 가져오기
            docker-compose up -d           # 컨테이너 실행/업데이트
