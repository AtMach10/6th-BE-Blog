name: CI/CD Pipeline

on:
  push:
    branches:
      - "장유정/main"
      - "장유정/8주차"
  pull_request:
    branches:
      - "장유정/main"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '23'

      - name: Build with Gradle
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew build -x test #테스트 제외

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          cd backend
          docker build -t docyoojung/my-app:latest .
          docker push docyoojung/my-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port : 22
          script: |
            cd /myproject                 # docker-compose.yml 있는 디렉토리
            docker-compose pull            # 최신 이미지 가져오기
            docker-compose up -d           # 컨테이너 실행/업데이트
